<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Depósito, camión de reparto y comercio: cada entrega confirmada por QR y su huella sellada en Hedera</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#26344D" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Retícula de fondo -->
  <rect width="800" height="600" fill="url(#grid)" opacity="0.6"/>

  <g fill="none" stroke="#F1F5F9" stroke-width="3" stroke-linejoin="miter" stroke-linecap="square">
    <!-- Suelo -->
    <path d="M20 480H780"/>

    <!-- Depósito -->
    <path d="M40 480V230L170 170L300 230V480"/>
    <path d="M70 480V300H270V480"/>
    <path d="M70 360H270M70 420H270"/>
    <!-- Cajas en estanterías -->
    <g fill="#1E3A5F">
      <rect x="85" y="318" width="34" height="34"/>
      <rect x="127" y="318" width="34" height="34"/>
      <rect x="215" y="318" width="40" height="34"/>
      <rect x="85" y="378" width="44" height="34"/>
      <rect x="170" y="378" width="34" height="34"/>
      <rect x="212" y="378" width="34" height="34"/>
      <rect x="85" y="438" width="34" height="34"/>
      <rect x="127" y="438" width="34" height="34"/>
      <rect x="170" y="438" width="44" height="34"/>
    </g>

    <!-- Camión de reparto -->
    <rect x="330" y="350" width="180" height="100" fill="#1E3A5F"/>
    <path d="M510 380H560L590 410V450H510"/>
    <path d="M525 390H555L572 410H525Z"/>
    <circle cx="370" cy="460" r="18" fill="#0A101C"/>
    <circle cx="555" cy="460" r="18" fill="#0A101C"/>
    <!-- Cajas dentro del camión -->
    <g stroke-width="2">
      <rect x="350" y="400" width="36" height="36"/>
      <rect x="394" y="400" width="36" height="36"/>
      <rect x="372" y="364" width="36" height="36"/>
    </g>

    <!-- Comercio -->
    <path d="M620 480V300H770V480"/>
    <path d="M610 300H780L765 260H625Z" fill="#7DB4F5" stroke="#7DB4F5"/>
    <path d="M655 260L650 300M695 260V300M735 260L740 300" stroke="#1E3A5F" stroke-width="3"/>
    <rect x="640" y="330" width="55" height="45"/>
    <path d="M715 480V340H755V480"/>
  </g>

  <!-- Recorrido de la entrega -->
  <path d="M170 150C260 90 360 90 420 150S600 210 695 150" fill="none" stroke="#7DB4F5" stroke-width="3" stroke-dasharray="10 10"/>
  <g fill="#7DB4F5">
    <rect x="162" y="142" width="16" height="16"/>
    <rect x="412" y="142" width="16" height="16"/>
  </g>

  <!-- Celular con QR: el comercio confirma -->
  <g transform="translate(655 70)">
    <rect width="80" height="130" fill="#0A101C" stroke="#F1F5F9" stroke-width="3"/>
    <g fill="#F1F5F9">
      <rect x="14" y="22" width="20" height="20"/>
      <rect x="46" y="22" width="20" height="20"/>
      <rect x="14" y="54" width="20" height="20"/>
      <rect x="46" y="58" width="8" height="8"/>
      <rect x="58" y="54" width="8" height="8"/>
      <rect x="58" y="66" width="8" height="8"/>
    </g>
    <rect x="12" y="92" width="56" height="24" fill="#7DB4F5"/>
    <path d="M28 104L36 111L52 97" fill="none" stroke="#1E3A5F" stroke-width="4"/>
  </g>

  <!-- Huella sellada en Hedera: cadena de registros -->
  <g transform="translate(40 40)" font-family="IBM Plex Mono, monospace" font-size="14">
    <g fill="none" stroke="#F1F5F9" stroke-width="2">
      <rect width="56" height="40"/>
      <rect x="84" width="56" height="40"/>
      <rect x="168" width="56" height="40" fill="#1E3A5F"/>
      <path d="M56 20H84M140 20H168"/>
    </g>
    <text x="0" y="66" fill="#7DB4F5" letter-spacing="1">SHA-256 · HCS</text>
  </g>
</svg>
